<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- SOLO para el WebUI de Chromium (Roboto): JetBrains Mono.
       No tocar Adwaita Sans / sans-serif / serif ni las demas:
       son las fuentes del sistema (GTK/Tilix) y las cambian/rompen. -->
  <match target="pattern"><test name="family"><string>Roboto</string></test>
    <edit name="family" mode="assign" binding="weak"><string>JetBrains Mono</string></edit></match>
</fontconfig>
